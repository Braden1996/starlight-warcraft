name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
          no-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1
          package-manager-cache: false
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          cache: false
          install_args: aqua:rhysd/actionlint aqua:zizmorcore/zizmor aqua:lycheeverse/lychee aqua:gitleaks/gitleaks
      - uses: Braden1996/sergeant-releases/actions/setup@v0.15.0
        with:
          seal-sysctl: "true"
      - uses: Braden1996/sergeant-releases/actions/ci@v0.15.0
      - uses: Braden1996/sergeant-releases/actions/release-npm@v0.15.0
        with:
          working-directory: packages/libraries/ts/dom/starlight-warcraft
          changelog: ../../../../../CHANGELOG.md
