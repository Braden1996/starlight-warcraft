name: pages

on:
  push:
    branches: [main]
    paths:
      - "packages/**"
      - "package.json"
      - "bun.lock"
      - "sergeant.jsonc"
      - "tsconfig.base.json"
      - "mise.toml"
      - ".github/workflows/pages.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page-url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1
          package-manager-cache: false
      - uses: Braden1996/sergeant-releases/actions/setup@v0.15.0
        with:
          seal-sysctl: "true"
      - run: sgt --no-daemon install --frozen
      - id: deployment
        uses: Braden1996/sergeant-releases/actions/deploy-astro-pages@v0.15.0
        with:
          unit: "@starlight-warcraft/demo"
          deploy: "true"
