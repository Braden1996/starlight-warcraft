name: Feature request
description: A new component, variant or theme option.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you want
      description: The component or option, and where you would use it. Link the warcraftcn/ui original if there is one.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you do today instead
